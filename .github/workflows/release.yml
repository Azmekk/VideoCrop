name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          # Strip any pre-release suffix for AssemblyVersion compatibility.
          $clean = ($version -split '-')[0]
          "version=$clean" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore VideoCrop.slnx

      - name: Test
        run: dotnet test VideoCrop.slnx -c Release --no-restore

      - name: Publish (${{ matrix.rid }})
        shell: pwsh
        run: |
          dotnet publish src/VideoCrop.App `
            -c Release `
            -r ${{ matrix.rid }} `
            --no-self-contained `
            /p:Version=${{ steps.ver.outputs.version }} `
            -o publish/${{ matrix.rid }}

      - name: Zip artifact
        shell: pwsh
        run: |
          $zip = "VideoCrop-${{ steps.ver.outputs.tag }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: ${{ env.ZIP_NAME }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # A hyphen in the tag (e.g. v2.0.0-rc1, v1.0.0-beta) marks a
          # pre-release. GitHub's `releases/latest` API skips prereleases, so
          # the in-app updater won't offer it to users.
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE_FLAG \
            artifacts/*/*.zip
