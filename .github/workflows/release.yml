name: Release

# Push a tag like v2.1.0 to build the Windows installer + portable exe and publish a GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v), e.g. 2.1.0 — builds artifacts only, no release'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # Each architecture builds natively on its own runner, in parallel (no emulation, no cross-compile).
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    defaults:
      run:
        shell: pwsh
        working-directory: tauri

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}".TrimStart('v') }
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Invalid version '$v'" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: tauri/package.json
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: tauri/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Test core
        if: matrix.arch == 'x64'
        working-directory: tauri/src-tauri
        run: cargo test --locked

      - name: Build installer
        run: |
          # Stamp the tag's version into the app (shown in the update check) without editing files in git.
          @{ version = "${{ steps.ver.outputs.version }}" } | ConvertTo-Json | Set-Content release.conf.json
          pnpm tauri build --target ${{ matrix.target }} --config release.conf.json

      - name: Collect artifacts
        id: collect
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $rel = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force out | Out-Null
          $setup = Get-ChildItem "$rel/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "NSIS installer not found" }
          Copy-Item $setup.FullName "out/VideoCrop-v$v-${{ matrix.arch }}-setup.exe"
          Copy-Item "$rel/videocrop.exe" "out/VideoCrop-v$v-${{ matrix.arch }}-portable.exe"
          Get-ChildItem out | ForEach-Object { "{0,-48} {1,8:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: videocrop-${{ matrix.arch }}
          path: tauri/out/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: VideoCrop ${{ github.ref_name }}
          generate_release_notes: true
          # Published immediately on the tag push, never a draft. Tags with a suffix (v3.1.0-beta) are prereleases.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: artifacts/*
          body: |
            ### Download
            - **Installer (recommended):** `VideoCrop-${{ github.ref_name }}-x64-setup.exe` — per-user install, no admin needed, adds a Start menu entry and an uninstaller.
            - **Portable:** `VideoCrop-${{ github.ref_name }}-x64-portable.exe` — single exe, needs the WebView2 runtime (built into Windows 11).
            - ARM64 builds are the `-arm64` files.

            On first launch VideoCrop downloads ffmpeg (~100 MB) once.
