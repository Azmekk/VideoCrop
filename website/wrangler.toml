# Cloudflare Worker that serves the VideoCrop website as static assets (no Worker script).
#   npx wrangler dev      local preview on http://localhost:8787
#   npx wrangler deploy   publish to <name>.<your-subdomain>.workers.dev
name = "videocrop"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"

# Serve it on your own domain. The zone (vexbyte.com) must be on the same Cloudflare account;
# wrangler creates the DNS record and certificate on deploy.
# routes = [{ pattern = "videocrop.vexbyte.com", custom_domain = true }]
